<!DOCTYPE html>
<html lang="hu" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090d13">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Alpha Network – prémium Minecraft szerverirányítópult, statisztikák, skin kezelés és staff eszközök.">
  <title>Alpha Network · Privát Minecraft élmény</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('alpha.web.theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f7fb' : '#090d13');
      } catch (error) {
        /* A locked-down Qt profile can disable localStorage; the dark default remains. */
      }
    })();
  </script>
</head>
<body>
  <div class="boot-screen" id="boot-screen" role="status" aria-label="Alpha Network betöltése">
    <div class="boot-inner">
      <span class="boot-logo">
        <svg width="42" height="42" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path d="M16 2 29 9.5v13L16 30 3 22.5v-13L16 2Z" fill="currentColor" opacity=".18"/>
          <path d="M16 2 29 9.5 16 17 3 9.5 16 2Z" fill="currentColor" opacity=".95"/>
          <path d="M3 9.5 16 17v13L3 22.5v-13Z" fill="currentColor" opacity=".55"/>
          <path d="M29 9.5 16 17v13l13-7.5v-13Z" fill="currentColor" opacity=".32"/>
        </svg>
      </span>
      <span class="boot-title">Alpha Network</span>
      <span class="boot-bars" aria-hidden="true"><span></span><span></span><span></span></span>
    </div>
  </div>

  <div id="app"></div>
  <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <div class="fatal-error">
      <h1>JavaScript szükséges</h1>
      <p>Az Alpha Network irányítópultja JavaScript nélkül nem használható. Engedélyezd a JavaScriptet a launcherben vagy a böngésződben.</p>
    </div>
  </noscript>

  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
