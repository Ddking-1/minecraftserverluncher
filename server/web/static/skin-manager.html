<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Manager - Minecraft Launcher</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();

        (function() {
            const lang = localStorage.getItem('lang') || 'hu';
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.setAttribute('data-lang', lang);
        })();
    </script>
    <script src="i18n.js" defer></script>
    <script src="theme.js" defer></script>
</head>
<body class="min-h-screen bg-gray-900 text-white">
    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-green-400">Minecraft Launcher</a>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="themeToggle" class="p-2 rounded-lg hover:bg-gray-700 transition" aria-label="Váltás sötét/fényes mód">
                        <svg id="themeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                    </button>
                    <select id="langSwitcher" class="bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option value="hu">Magyar</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="max-w-2xl mx-auto">
            <h1 class="text-2xl font-bold mb-6" data-i18n="skinManager.title">Skin Manager</h1>
            <div class="card">
                <div class="card-header" data-i18n="skinManager.login">Belépés</div>
                <form id="loginForm" class="space-y-4" onsubmit="event.preventDefault(); login();">
                    <div>
                        <label class="block text-sm font-medium mb-1" data-i18n="skinManager.username">Felhasználónév</label>
                        <input type="text" id="username" required class="input">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1" data-i18n="skinManager.password">Jelszó</label>
                        <input type="password" id="password" required class="input">
                    </div>
                    <button type="submit" class="btn btn-primary w-full" data-i18n="skinManager.login">Belépés</button>
                </form>
            </div>
            <div id="uploadSection" class="card mt-6 hidden">
                <div class="card-header" data-i18n="skinManager.upload">Skin Feltöltés</div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1" data-i18n="skinManager.selectSkin">Válassz egy képet</label>
                        <input type="file" id="skinFileInput" accept="image/png, image/jpeg" class="input file-input">
                    </div>
                    <div id="previewArea" class="hidden flex justify-center">
                        <img id="preview" class="max-h-64 rounded-lg shadow-lg" alt="Preview">
                    </div>
                    <div class="flex gap-3">
                        <button onclick="uploadSkin()" class="btn btn-primary flex-1" data-i18n="skinManager.upload">Feltöltés</button>
                        <button onclick="loadSkins()" class="btn btn-secondary" data-i18n="skinManager.refresh">Frissítés</button>
                    </div>
                    <p id="status" class="text-center text-sm text-muted"></p>
                </div>
            </div>
            <div id="skinsList" class="card mt-6 hidden">
                <div class="card-header" data-i18n="skinManager.mySkins">Saját Skinek</div>
                <ul id="skins" class="divide-y divide-gray-700"></ul>
            </div>
        </div>
    </main>
    <script>
        (function() {
            const STORAGE_KEY_AUTH = 'minecraft_launcher_auth';
            let auth = JSON.parse(localStorage.getItem(STORAGE_KEY_AUTH) || 'null');

            function showSection(sectionId) {
                document.getElementById(sectionId).classList.remove('hidden');
            }

            function hideSection(sectionId) {
                document.getElementById(sectionId).classList.add('hidden');
            }

            function setStatus(message) {
                document.getElementById('status').textContent = message;
            }

            function previewImage(event) {
                const reader = new FileReader();
                reader.onload = function() {
                    const preview = document.getElementById('preview');
                    preview.src = reader.result;
                    showSection('previewArea');
                };
                reader.readAsDataURL(event.target.files[0]);
            }

            window.login = async function() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                try {
                    const response = await fetch('/api/v1/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: username,
                            password: password,
                            device_id: 'web-dashboard',
                            device_name: 'Web'
                        })
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        setStatus(data.error || 'Hiba occurred');
                        return;
                    }

                    const data = await response.json();
                    auth = {
                        accessToken: data.access_token,
                        refreshToken: data.refresh_token,
                        username: username
                    };
                    localStorage.setItem(STORAGE_KEY_AUTH, JSON.stringify(auth));
                    showSection('uploadSection');
                    showSection('skinsList');
                    loadSkins();
                } catch (e) {
                    setStatus(e.message);
                }
            };

            window.uploadSkin = async function() {
                const fileInput = document.getElementById('skinFileInput');
                if (!fileInput.files || !fileInput.files[0]) {
                    setStatus('Kérlek válassz egy képet');
                    return;
                }

                if (!auth || !auth.accessToken) {
                    setStatus('Kérlek first belépj');
                    return;
                }

                const formData = new FormData();
                formData.append('skin', fileInput.files[0]);

                try {
                    const response = await fetch('/api/v1/skins/default', {
                        method: 'PUT',
                        body: formData,
                        headers: { 'Authorization': `Bearer ${auth.accessToken}` }
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        setStatus(data.error || 'Hiba occurred');
                        return;
                    }

                    setStatus('Sikeresen feltöltve!');
                    loadSkins();
                } catch (e) {
                    setStatus(e.message);
                }
            };

            window.loadSkins = async function() {
                if (!auth || !auth.accessToken) {
                    return;
                }

                const skinsList = document.getElementById('skins');
                skinsList.innerHTML = '';

                try {
                    const response = await fetch('/api/v1/skins', {
                        headers: { 'Authorization': `Bearer ${auth.accessToken}` }
                    });

                    if (!response.ok) {
                        throw new Error('Hiba occurred');
                    }

                    const data = await response.json();
                    const skins = data.skins || [];

                    if (skins.length === 0) {
                        skinsList.innerHTML = '<li class="py-4 text-center text-muted">Nincsenek feltöltött skinek</li>';
                        return;
                    }

                    skins.forEach(skin => {
                        const li = document.createElement('li');
                        li.className = 'flex items-center justify-between py-3';
                        li.innerHTML = `
                            <div>
                                <span class="font-medium">${skin.variant}</span>
                                <span class="text-xs text-muted ml-2">${skin.content_type}</span>
                            </div>
                            <span class="text-xs text-muted">${new Date(skin.created_at).toLocaleDateString()}</span>
                        `;
                        skinsList.appendChild(li);
                    });
                } catch (e) {
                    setStatus(e.message);
                }
            };

            document.addEventListener('DOMContentLoaded', function() {
                if (auth) {
                    showSection('uploadSection');
                    showSection('skinsList');
                    loadSkins();
                }
            });
        })();
    </script>
</body>
</html>
