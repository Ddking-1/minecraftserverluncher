<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Manager - Minecraft Launcher</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
        (function() {
            const lang = localStorage.getItem('lang') || 'hu';
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.setAttribute('data-lang', lang);
        })();
    </script>
    <script src="i18n.js" defer></script>
    <script src="theme.js" defer></script>
</head>
<body class="min-h-screen bg-gray-900 text-white">
    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-green-400">Minecraft Launcher</a>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="themeToggle" class="p-2 rounded-lg hover:bg-gray-700 transition" aria-label="Váltás sötét/fényes mód">
                        <svg id="themeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                    </button>
                    <select id="langSwitcher" class="bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option value="hu">Magyar</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>
        </div>
    </nav>

    <main class="auth-wrap">
        <div class="auth-card animate-slide">
            <h1 class="auth-title">Skin Manager</h1>
            <p class="auth-sub">Belépés vagy regisztráció a skinek kezeléséhez</p>

            <div id="authSection">
                <div class="tab-row">
                    <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Belépés</button>
                    <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Regisztráció</button>
                </div>

                <div id="loginForm">
                    <div class="space-y-3">
                        <input type="text" id="loginUsername" placeholder="Felhasználónév" class="input">
                        <input type="password" id="loginPassword" placeholder="Jelszó" class="input">
                        <button onclick="doLogin()" class="btn btn-primary w-full">Belépés</button>
                    </div>
                </div>

                <div id="registerForm" class="hidden">
                    <div class="space-y-3">
                        <input type="text" id="regUsername" placeholder="Felhasználónév (3-32)" class="input">
                        <input type="password" id="regPassword" placeholder="Jelszó (min. 8)" class="input">
                        <button onclick="doRegister()" class="btn btn-primary w-full">Regisztráció</button>
                    </div>
                </div>
                <p id="authStatus" class="text-center text-sm text-red-400 mt-3"></p>
            </div>

            <div id="uploadSection" class="hidden animate-fade">
                <div class="card-header" style="border-bottom:1px solid var(--border-color);padding-bottom:.5rem;margin-bottom:1rem;font-weight:600;">Skin Feltöltés</div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Válassz egy képet</label>
                        <input type="file" id="skinFileInput" accept="image/png, image/jpeg" class="input file-input" onchange="previewImage(event)">
                    </div>
                    <div id="previewArea" class="preview-box hidden">
                        <img id="preview" alt="Preview">
                    </div>
                    <div class="flex gap-3">
                        <button onclick="uploadSkin()" class="btn btn-primary flex-1">Feltöltés</button>
                        <button onclick="loadSkins()" class="btn btn-secondary">Frissítés</button>
                    </div>
                    <p id="status" class="text-center text-sm text-muted"></p>
                </div>

                <div id="skinsList" class="mt-6">
                    <div class="card-header" style="border-bottom:1px solid var(--border-color);padding-bottom:.5rem;margin-bottom:.5rem;font-weight:600;">Saját Skinek</div>
                    <ul id="skins" class="divide-y divide-gray-700"></ul>
                </div>
            </div>
        </div>
    </main>

    <script>
        const STORAGE_KEY_AUTH = 'minecraft_launcher_auth';

        function getAuth() {
            const raw = localStorage.getItem(STORAGE_KEY_AUTH);
            if (!raw) return null;
            try { return JSON.parse(raw); } catch (e) { return null; }
        }
        function setAuth(a) { localStorage.setItem(STORAGE_KEY_AUTH, JSON.stringify(a)); }
        function clearAuth() { localStorage.removeItem(STORAGE_KEY_AUTH); }

        function switchTab(tab) {
            document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
            document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('authStatus').textContent = '';
        }

        function showUpload() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('uploadSection').classList.remove('hidden');
        }

        async function doLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const status = document.getElementById('authStatus');
            status.textContent = '';
            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, device_id: 'web-skin-manager', device_name: 'Web' })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) { status.textContent = data.error || 'Hiba'; return; }
                setAuth({ accessToken: data.access_token, refreshToken: data.refresh_token, username });
                showUpload();
                loadSkins();
            } catch (e) { status.textContent = e.message; }
        }

        async function doRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const status = document.getElementById('authStatus');
            status.textContent = '';
            try {
                const res = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, device_id: 'web-skin-manager', device_name: 'Web' })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) { status.textContent = data.error || 'Hiba'; return; }
                setAuth({ accessToken: data.access_token, refreshToken: data.refresh_token, username });
                showUpload();
                loadSkins();
            } catch (e) { status.textContent = e.message; }
        }

        function previewImage(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function() {
                const preview = document.getElementById('preview');
                preview.src = reader.result;
                document.getElementById('previewArea').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function uploadSkin() {
            const fileInput = document.getElementById('skinFileInput');
            if (!fileInput.files || !fileInput.files[0]) {
                setStatus('Kérlek válassz egy képet'); return;
            }
            const auth = getAuth();
            if (!auth || !auth.accessToken) { setStatus('Kérlek előbb belépj'); return; }
            const formData = new FormData();
            formData.append('skin', fileInput.files[0]);
            try {
                const res = await fetch('/api/v1/skins/default', {
                    method: 'PUT',
                    body: formData,
                    headers: { 'Authorization': `Bearer ${auth.accessToken}` }
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) { setStatus(data.error || 'Hiba'); return; }
                setStatus('Sikeresen feltöltve!');
                loadSkins();
            } catch (e) { setStatus(e.message); }
        }

        async function loadSkins() {
            const auth = getAuth();
            if (!auth || !auth.accessToken) return;
            const skinsList = document.getElementById('skins');
            skinsList.innerHTML = '';
            try {
                const res = await fetch('/api/v1/skins', { headers: { 'Authorization': `Bearer ${auth.accessToken}` } });
                if (!res.ok) throw new Error('Hiba');
                const data = await res.json();
                const skins = data.skins || [];
                if (skins.length === 0) {
                    skinsList.innerHTML = '<li class="py-4 text-center text-muted">Nincsenek feltöltött skinek</li>';
                    return;
                }
                skins.forEach(skin => {
                    const li = document.createElement('li');
                    li.className = 'flex items-center justify-between py-3';
                    li.innerHTML = `<div><span class="font-medium">${skin.variant}</span><span class="text-xs text-muted ml-2">${skin.content_type}</span></div><span class="text-xs text-muted">${new Date(skin.created_at).toLocaleDateString()}</span>`;
                    skinsList.appendChild(li);
                });
            } catch (e) { setStatus(e.message); }
        }

        function setStatus(m) { document.getElementById('status').textContent = m; }

        document.addEventListener('DOMContentLoaded', function() {
            const auth = getAuth();
            if (auth && auth.accessToken) {
                showUpload();
                loadSkins();
            }
        });
    </script>
</body>
</html>
