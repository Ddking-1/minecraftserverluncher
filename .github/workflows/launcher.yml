name: launcher

on:
  push:
    branches: [master]
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'

jobs:
  build:
    runs-on: windows-latest  # Option A (docs/PROJECT_STATUS.md §9): GitHub-hosted Windows. Monitor Actions minutes (2000/month free for private repos); switch to a self-hosted Windows runner if exhausted.
    # Least privilege: only read contents.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Qt
        id: install_qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.6.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          # Deterministic install root: aqt creates <dir>/6.6.3/msvc2019_64.
          dir: ${{ github.workspace }}/Qt
          cache: true
      - name: Configure
        run: cmake -S launcher -B launcher/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.6.3/msvc2019_64"
      - name: Build
        run: cmake --build launcher/build --config Release
      - name: Test
        run: ctest --test-dir launcher/build -C Release --output-on-failure
