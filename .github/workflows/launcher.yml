name: launcher

on:
  push:
    branches: [master]
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'

jobs:
  build:
    runs-on: windows-latest  # Option A (docs/PROJECT_STATUS.md §9): GitHub-hosted Windows. Monitor Actions minutes (2000/month free for private repos); switch to a self-hosted Windows runner if exhausted.
    # Least privilege: only read contents.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Qt
        id: install_qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.6.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          # aqt creates <dir>/Qt/<version>/<arch> (it adds its own "Qt" folder).
          dir: ${{ github.workspace }}
          cache: true
      - name: Configure
        shell: pwsh
        run: |
          # windows-latest now ships Visual Studio 2026 (generator "Visual Studio 18 2026"),
          # so pick the newest generator the image actually has instead of pinning VS 17.
          $help = cmake --help | Out-String
          $generator = $null
          foreach ($g in @('Visual Studio 18 2026', 'Visual Studio 17 2022')) {
            if ($help -match [regex]::Escape($g)) { $generator = $g; break }
          }
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'Qt/6.6.3/msvc2019_64'
          if (-not (Test-Path $prefix)) { throw "Qt prefix not found: $prefix" }
          if ($generator) {
            Write-Host "Using generator: $generator"
            cmake -S launcher -B launcher/build -G $generator -A x64 -DCMAKE_PREFIX_PATH=$prefix
          } else {
            Write-Host 'No Visual Studio generator found; using the CMake default'
            cmake -S launcher -B launcher/build -A x64 -DCMAKE_PREFIX_PATH=$prefix
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build launcher/build --config Release
      - name: Test
        run: ctest --test-dir launcher/build -C Release --output-on-failure
      - name: Deploy Qt (windeployqt)
        shell: pwsh
        run: |
          $qtBin = Join-Path $env:GITHUB_WORKSPACE 'Qt/6.6.3/msvc2019_64/bin'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'launcher/build/Release/MinecraftLauncher.exe'
          if (-not (Test-Path $exe)) { throw "launcher exe not found: $exe" }
          & (Join-Path $qtBin 'windeployqt.exe') --release --no-translations $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload runnable launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftLauncher-windows
          path: launcher/build/Release/
          if-no-files-found: error
