name: launcher

on:
  push:
    branches: [master]
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'

jobs:
  build:
    runs-on: windows-latest  # Option A (docs/PROJECT_STATUS.md §9): GitHub-hosted Windows. Monitor Actions minutes (2000/month free for private repos); switch to a self-hosted Windows runner if exhausted.
    # Least privilege: only read contents.
    permissions:
      contents: read
    steps:
      # Node 20 actions are deprecated on the runners; v5 runs on Node 24.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Qt
        id: install_qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.6.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          # aqt creates <dir>/Qt/<version>/<arch> (it adds its own "Qt" folder).
          dir: ${{ github.workspace }}
          cache: true
      - name: Configure
        shell: pwsh
        run: |
          # windows-latest now ships Visual Studio 2026 (generator "Visual Studio 18 2026"),
          # so pick the newest generator the image actually has instead of pinning VS 17.
          $help = cmake --help | Out-String
          $generator = $null
          foreach ($g in @('Visual Studio 18 2026', 'Visual Studio 17 2022')) {
            if ($help -match [regex]::Escape($g)) { $generator = $g; break }
          }
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'Qt/6.6.3/msvc2019_64'
          if (-not (Test-Path $prefix)) { throw "Qt prefix not found: $prefix" }
          if ($generator) {
            Write-Host "Using generator: $generator"
            cmake -S launcher -B launcher/build -G $generator -A x64 -DCMAKE_PREFIX_PATH=$prefix
          } else {
            Write-Host 'No Visual Studio generator found; using the CMake default'
            cmake -S launcher -B launcher/build -A x64 -DCMAKE_PREFIX_PATH=$prefix
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build launcher/build --config Release
      - name: Test
        run: ctest --test-dir launcher/build -C Release --output-on-failure
      - name: Deploy Qt (windeployqt)
        shell: pwsh
        run: |
          $qtBin = Join-Path $env:GITHUB_WORKSPACE 'Qt/6.6.3/msvc2019_64/bin'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'launcher/build/Release/MinecraftLauncher.exe'
          if (-not (Test-Path $exe)) { throw "launcher exe not found: $exe" }

          # windeployqt only copies the MSVC runtime when VCINSTALLDIR is set
          # (otherwise it prints "Cannot find Visual Studio installation
          # directory"), so run it inside the developer shell. Without this the
          # uploaded artifact starts only on machines that already have the
          # Visual C++ redistributable.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere not found: $vswhere" }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'No Visual Studio installation with the C++ toolset found' }
          $vcvars = Join-Path $vsPath 'VC/Auxiliary/Build/vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }

          # A tiny batch file keeps the nested quoting out of PowerShell.
          $bat = Join-Path $env:RUNNER_TEMP 'deploy-qt.bat'
          $batLines = @(
            '@echo off',
            "call `"$vcvars`" >nul",
            "`"$qtBin\windeployqt.exe`" --release --no-translations --compiler-runtime `"$exe`"",
            'exit /b %ERRORLEVEL%'
          )
          Set-Content -Path $bat -Value $batLines -Encoding ascii
          & cmd /c $bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # windeployqt only drops vc_redist.x64.exe here, so deploy the CRT
          # app-local from the toolset's own redist folder (VC143, VC145, ...).
          $outDir = Split-Path $exe
          $crtDirs = Get-ChildItem -Path (Join-Path $vsPath 'VC/Redist/MSVC/*/x64/Microsoft.VC1*.CRT') -Directory -ErrorAction SilentlyContinue |
            Sort-Object -Property FullName -Descending
          if (-not $crtDirs) { throw "MSVC redist folder not found under $vsPath" }
          Copy-Item -Path (Join-Path $crtDirs[0].FullName '*.dll') -Destination $outDir -Force
          # The DLLs are now app-local; keep the 25 MB installer out of the artifact.
          Remove-Item -Path (Join-Path $outDir 'vc_redist.x64.exe') -ErrorAction SilentlyContinue

          # Fail loudly instead of uploading an artifact that cannot start.
          $missing = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') | Where-Object {
            -not (Test-Path (Join-Path $outDir $_))
          }
          if ($missing) { throw "The VC++ runtime was not deployed: $($missing -join ', ')" }
          Write-Host 'VC++ runtime deployed next to the launcher.'
      - name: Upload runnable launcher artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: MinecraftLauncher-windows
          path: launcher/build/Release/
          if-no-files-found: error
