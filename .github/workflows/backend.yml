name: backend

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend.yml'

jobs:
  build-and-test:
    runs-on: [self-hosted, linux]
    # Minimal, least-privilege token: contents read is all this job needs.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: go build ./...
