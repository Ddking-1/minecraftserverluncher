name: backend

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend.yml'

jobs:
  build-and-test:
    runs-on: windows-latest  # Option A (docs/PROJECT_STATUS.md §9): GitHub-hosted Windows. Monitor Actions minutes; switch to a self-hosted Windows runner if exhausted.
    # Minimal, least-privilege token: contents read is all this job needs.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      # Node 20 actions are deprecated on the runners; v5 runs on Node 24.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: go build ./...
      - name: Build server binary
        run: go build -o auth-server.exe .
      - name: Upload server artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: auth-server-windows
          path: server/auth-server.exe
          if-no-files-found: error
