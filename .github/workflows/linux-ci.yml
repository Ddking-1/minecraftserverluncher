name: linux-ci

# The Windows workflows (ci.yml, launcher.yml, backend.yml) target the
# self-hosted Windows runner. This workflow runs the parts of the project that
# are platform-independent on the self-hosted Debian runner, so pushes get a
# fast, always-available test signal even when the Windows runner is offline.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: server
    steps:
      # Node 20 actions are deprecated on the runners; v5 runs on Node 24.
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: go build ./...

  velocity:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Build Velocity plugin
        working-directory: velocity
        run: chmod +x gradlew && ./gradlew --no-daemon build
