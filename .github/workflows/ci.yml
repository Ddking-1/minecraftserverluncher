name: ci

on:
  push:
    branches:
      - master
      - main
      - "feature/**"
  pull_request:
    branches:
      - master
      - main

jobs:
  go:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth: the toolchain declared by the Go module.
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: go mod tidy check
        working-directory: server
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: go vet
        working-directory: server
        run: go vet ./...

      - name: go test -race
        working-directory: server
        run: go test ./... -count=1 -timeout 120s -v -race

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2024.1.1"
          install-go: true
          cache: true
          working-directory: server

  launcher:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v2

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Configure launcher (MSVC)
        uses: ilammy/msvc-dev-cmd@v2
        run: cmake -B build-ci -S launcher -G "Visual Studio 17 2022" -A x64

      - name: Build launcher (MSVC /W4 /WX)
        run: cmake --build build-ci --config Release --target MinecraftLauncher

      - name: Build and run launcher tests offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --build build-ci --config Release --target test_hwid test_settings test_update_manifest test_skin_model test_backend_contract test_settings_store test_mod_scanner test_skin_cache test_rotating_logger test_update_checker test_file_integrity test_editor_config test_skin_client test_download_asset test_download_queue test_java_detector test_game_paths test_game_launcher test_editor_settings_widget test_login_dialog test_main_window test_skin_upload_widget test_update_manager
          ctest --test-dir build-ci --output-on-failure -C Release

  velocity:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build Velocity plugin
        working-directory: velocity
        run: ./gradlew.bat --no-daemon build

  local-checks:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Validate local checks script exists
        run: Test-Path scripts/run_all_checks.ps1
