<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<style>
  body { background:#0d1117; color:#e6edf3; font-family: system-ui, Arial, sans-serif; margin:0; padding:20px; }
  h1,h2,h3 { color:#3fb950; }
  .row { display:flex; gap:10px; margin:10px 0; flex-wrap:wrap; align-items:center; }
  input,select,textarea,button { padding:6px 10px; border-radius:6px; border:1px solid #30363d; background:#161b22; color:#e6edf3; }
  button { background:#238636; color:#fff; border:none; cursor:pointer; }
  button.danger { background:#da3633; }
  button.secondary { background:#30363d; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th,td { border:1px solid #30363d; padding:6px; text-align:left; font-size:13px; }
  .card { background:#161b22; padding:15px; border-radius:8px; margin-bottom:20px; border:1px solid #30363d; }
  #status { margin:10px 0; color:#f85149; }
  .hidden { display:none; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:1000; }
  .modal { background:#161b22; padding:20px; border-radius:10px; width:520px; max-width:95vw; border:1px solid #30363d; }
  .modal h3 { margin-top:0; }
  .small { font-size:12px; color:#8b949e; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid #3fb950; outline-offset:2px; }
  button { min-height:32px; }
  .status-ok { color:#3fb950; }
  .status-bad { color:#f85149; }
  .modal { max-height:90vh; overflow:auto; }
</style>
</head>
<body>
<h1>Admin Dashboard</h1>
<div id="loginBox" class="card">
  <h2>Login</h2>
  <div class="row">
    <input type="password" id="adminToken" placeholder="X-Admin-Token (optional)">
    <input type="text" id="bearer" placeholder="Bearer access token (optional)">
    <button onclick="setAuth()">Set Auth</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</div>

<div id="appBox" class="hidden">
  <div class="card">
    <h2>Users</h2>
    <div class="row">
      <input type="text" id="userSearch" placeholder="search">
      <button onclick="loadUsers()">Refresh</button>
    </div>
    <table id="usersTable"><thead><tr>
      <th>ID</th><th>Username</th><th>Status</th><th>Created</th><th>Actions</th>
    </tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>Bans</h2>
    <div class="row"><button class="secondary" onclick="loadBans()">Refresh</button></div>
    <table id="bansTable"><thead><tr><th>ID</th><th>Type</th><th>Scope</th><th>Target</th><th>Reason</th><th>Active</th><th></th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>HWID bans</h2>
    <div class="row"><input type="text" id="hwidValue" placeholder="device id"><button onclick="banHwid()">Ban</button><button class="secondary" onclick="loadHwidBans()">Refresh</button></div>
    <table id="hwidTable"><thead><tr><th>Device ID</th><th></th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>Tripwires</h2>
    <button onclick="loadTripwires()">Refresh</button>
    <table id="tripTable"><thead><tr><th>ID</th><th>Kind</th><th>Detail</th><th>IP</th><th>Account</th><th>When</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>Skin approval</h2>
    <div class="row">
      <input type="text" id="skinId" placeholder="skin id">
      <button onclick="approveSkin(true)">Approve</button>
      <button onclick="approveSkin(false)">Reject</button>
    </div>
  </div>

  <div class="card">
    <h2>Invites</h2>
    <div class="row">
      <input type="text" id="inviteIdent" placeholder="identifier">
      <button onclick="addInvite()">Add</button>
      <button class="secondary" onclick="loadInvites()">Refresh</button>
    </div>
    <table id="inviteTable"><thead><tr><th>ID</th><th>Identifier</th><th>When</th><th></th></tr></thead><tbody></tbody></table>
  </div>
</div>

<div id="banModal" class="hidden">
  <div class="modal-backdrop" onclick="closeBanModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>Ban user <span id="banUserName"></span></h3>
      <div class="row"><label>Duration (minutes, 0=permanent)</label><input type="number" id="banDuration" value="0" min="0"></div>
      <div class="row"><label>Reason (shown to player)</label><input type="text" id="banReason" placeholder="reason" maxlength="500"></div>
      <div class="row"><label>Scope</label>
        <select id="banScope">
          <option value="mc">Minecraft only</option>
          <option value="platform">Whole platform</option>
          <option value="both" selected>Both</option>
        </select>
      </div>
      <div class="row"><label>Targets</label>
        <label><input type="checkbox" value="account" checked> Account</label>
        <label><input type="checkbox" value="hwid"> All HWIDs (last 30d)</label>
        <label><input type="checkbox" value="ip"> IP(s) used (last 30d)</label>
      </div>
      <div class="row" style="justify-content:flex-end">
        <button class="secondary" onclick="closeBanModal()">Cancel</button>
        <button class="danger" onclick="confirmBan()">Ban</button>
      </div>
    </div>
  </div>
</div>

<div id="actionModal" class="hidden">
  <div class="modal-backdrop" onclick="closeActionModal(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="actionTitle" onclick="event.stopPropagation()">
      <h3 id="actionTitle"></h3>
      <div class="row"><label for="actionDuration">Duration (minutes, 0=permanent)</label><input type="number" id="actionDuration" value="0" min="0"></div>
      <div class="row"><label for="actionReason">Reason (shown to player)</label><input type="text" id="actionReason" placeholder="reason" maxlength="500"></div>
      <div class="row"><label for="actionScope">Scope</label>
        <select id="actionScope">
          <option value="mc">Minecraft only</option>
          <option value="platform">Whole platform</option>
          <option value="both" selected>Both</option>
        </select>
      </div>
      <div class="row"><label>Targets</label>
        <label><input type="checkbox" value="account" checked> Account</label>
        <label><input type="checkbox" value="hwid"> All HWIDs (last 30d)</label>
        <label><input type="checkbox" value="ip"> IP(s) used (last 30d)</label>
      </div>
      <div class="row" style="justify-content:flex-end">
        <button class="secondary" onclick="closeActionModal()">Cancel</button>
        <button class="danger" id="actionConfirmBtn" onclick="confirmAction()">Confirm</button>
      </div>
    </div>
  </div>
</div>

<div id="detailsModal" class="hidden">
  <div class="modal-backdrop" onclick="closeDetailsModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>User details</h3>
      <div id="detailsBody"></div>
      <div class="row" style="justify-content:flex-end">
        <button class="secondary" onclick="closeDetailsModal()">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
let adminToken=''; let bearer=''; let banTargetId=null; let actionTargetId=null; let actionType=null;

function authHeaders(){const h={}; if(adminToken) h['X-Admin-Token']=adminToken; if(bearer) h['Authorization']='Bearer '+bearer; return h;}
function setAuth(){ adminToken=document.getElementById('adminToken').value; bearer=document.getElementById('bearer').value; document.getElementById('loginBox').classList.add('hidden'); document.getElementById('appBox').classList.remove('hidden'); loadUsers(); loadTripwires(); loadInvites(); loadBans(); loadHwidBans(); }
function status(msg){ document.getElementById('status').textContent=msg; }

async function loadUsers(){
  const q=document.getElementById('userSearch').value;
  const res=await fetch('/api/admin/users'+(q?'?q='+encodeURIComponent(q):''),{headers:authHeaders()});
  const data=await res.json().catch(()=>({}));
  const tbody=document.querySelector('#usersTable tbody'); tbody.innerHTML='';
  const users=data.users||[];
  for(const u of users){
    const tr=document.createElement('tr');
    const tdId=document.createElement('td'); tdId.textContent=u.id;
    const tdName=document.createElement('td'); tdName.textContent=u.username;
    const tdStatus=document.createElement('td');
    const badges=[];
    if(u.banned) badges.push('Banned');
    if(u.minecraft_banned) badges.push('MC banned');
    if(u.approved===false) badges.push('Unapproved');
    tdStatus.textContent=badges.length?badges.join(', '):'OK';
    const tdCreated=document.createElement('td'); tdCreated.textContent=u.created_at||'';
    const tdAct=document.createElement('td');
    const bDetails=document.createElement('button'); bDetails.textContent='Details'; bDetails.className='secondary'; bDetails.addEventListener('click',()=>openDetails(u.id));
    const bBan=document.createElement('button'); bBan.textContent='Ban'; bBan.className='danger'; bBan.addEventListener('click',()=>openBanModal(u.id,u.username));
    const bKick=document.createElement('button'); bKick.textContent='Kick'; bKick.className='danger'; bKick.addEventListener('click',()=>openActionModal('kick',u.id,u.username));
    const bMute=document.createElement('button'); bMute.textContent='Mute'; bMute.className='secondary'; bMute.addEventListener('click',()=>openActionModal('mute',u.id,u.username));
    const bWarn=document.createElement('button'); bWarn.textContent='Warn'; bWarn.className='secondary'; bWarn.addEventListener('click',()=>openActionModal('warn',u.id,u.username));
    const bUnban=document.createElement('button'); bUnban.textContent='Unban'; bUnban.className='secondary'; bUnban.addEventListener('click',()=>unbanUser(u.id));
    const bUnmute=document.createElement('button'); bUnmute.textContent='Unmute'; bUnmute.className='secondary'; bUnmute.addEventListener('click',()=>unmuteUser(u.id));
    const bDel=document.createElement('button'); bDel.textContent='Delete'; bDel.className='danger'; bDel.addEventListener('click',()=>deleteUser(u.id));
    tdAct.appendChild(bDetails); tdAct.appendChild(bBan); tdAct.appendChild(bKick); tdAct.appendChild(bMute); tdAct.appendChild(bWarn); tdAct.appendChild(bUnban); tdAct.appendChild(bUnmute); tdAct.appendChild(bDel);
    tr.appendChild(tdId); tr.appendChild(tdName); tr.appendChild(tdStatus); tr.appendChild(tdCreated); tr.appendChild(tdAct);
    tbody.appendChild(tr);
  }
  if(!res.ok) status('users: '+res.status);
}

async function deleteUser(id){
  if(!confirm('Delete user '+id+'?')) return;
  const res=await fetch('/api/admin/users/'+id,{method:'DELETE',headers:authHeaders()});
  status('delete '+id+': '+res.status);
  loadUsers();
}

function openBanModal(id, username){
  banTargetId=id;
  document.getElementById('banUserName').textContent=username+' (#'+id+')';
  document.getElementById('banModal').classList.remove('hidden');
}
function closeBanModal(e){ if(e && e.target!==e.currentTarget) return; document.getElementById('banModal').classList.add('hidden'); }

async function confirmBan(){
  const targets=[...document.querySelectorAll('#banModal input[type=checkbox]:checked')].map(c=>c.value);
  if(targets.length===0){ status('select at least one ban target'); return; }
  const duration=parseInt(document.getElementById('banDuration').value||'0',10);
  if(!Number.isFinite(duration) || duration<0){ status('duration must be 0 or greater'); return; }
  const reason=document.getElementById('banReason').value;
  if(reason.length>500){ status('reason must be 500 characters or fewer'); return; }
  const body={
    duration_minutes: duration,
    reason: reason,
    scope: document.getElementById('banScope').value,
    targets: targets,
    lookback_days: 30,
  };
  const res=await fetch('/api/admin/users/'+banTargetId+'/ban',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify(body)});
  const data=await res.json().catch(()=>({}));
  if(!res.ok){ status('ban failed: '+res.status+' '+(data.error||'')); return; }
  status('ban: '+res.status+' '+JSON.stringify(data.counts||{})+' (affected IPs: '+(data.affected_ip_count||0)+')');
  closeBanModal();
  loadUsers();
  loadBans();
}

function openActionModal(type,id,username){
  actionType=type;
  actionTargetId=id;
  const title=type.charAt(0).toUpperCase()+type.slice(1)+' user '+username+' (#'+id+')';
  document.getElementById('actionTitle').textContent=title;
  document.getElementById('actionConfirmBtn').textContent=title.split(' ')[0];
  document.getElementById('actionModal').classList.remove('hidden');
}
function closeActionModal(e){ if(e && e.target!==e.currentTarget) return; document.getElementById('actionModal').classList.add('hidden'); }

async function confirmAction(){
  const targets=[...document.querySelectorAll('#actionModal input[type=checkbox]:checked')].map(c=>c.value);
  if(targets.length===0){ status('select at least one target'); return; }
  const duration=parseInt(document.getElementById('actionDuration').value||'0',10);
  if(!Number.isFinite(duration) || duration<0){ status('duration must be 0 or greater'); return; }
  const reason=document.getElementById('actionReason').value;
  if(reason.length>500){ status('reason must be 500 characters or fewer'); return; }
  const body={
    duration_minutes: duration,
    reason: reason,
    scope: document.getElementById('actionScope').value,
    targets: targets,
    lookback_days: 30,
  };
  const res=await fetch('/api/admin/users/'+actionTargetId+'/'+actionType,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify(body)});
  const data=await res.json().catch(()=>({}));
  if(!res.ok){ status(actionType+' failed: '+res.status+' '+(data.error||'')); return; }
  status(actionType+': '+res.status+' '+JSON.stringify(data.counts||{})+' (affected IPs: '+(data.affected_ip_count||0)+')');
  closeActionModal();
  loadUsers();
  loadBans();
}

async function unmuteUser(id){
  const res=await fetch('/api/admin/users/'+id+'/unmute',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({targets:['account','hwid','ip']})});
  const data=await res.json().catch(()=>({}));
  status('unmute '+id+': '+res.status+' '+(data.status||''));
  loadUsers();
  loadBans();
}

async function unbanUser(id){
  const res=await fetch('/api/admin/users/'+id+'/unban',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({targets:['account','hwid','ip']})});
  status('unban '+id+': '+res.status);
  loadUsers();
}

async function openDetails(id){
  const res=await fetch('/api/admin/users/'+id+'/details',{headers:authHeaders()});
  const d=await res.json().catch(()=>({}));
  const body=document.getElementById('detailsBody');
  body.innerHTML='';
  const title=document.createElement('h4'); title.textContent=(d.username||'User')+' #'+(d.id||id); body.appendChild(title);
  const meta=document.createElement('p'); meta.className='small'; meta.textContent='Created: '+(d.created_at||'')+' | MC banned: '+(d.minecraft_banned?'yes':'no'); body.appendChild(meta);
  const devicesTitle=document.createElement('h5'); devicesTitle.textContent='Devices (last 30 days)'; body.appendChild(devicesTitle);
  const devList=document.createElement('ul');
  for(const dev of (d.devices_last_30d||[])){ devList.appendChild(Object.assign(document.createElement('li'),{textContent:dev.device_id+' ('+(dev.name||'')+') last seen '+dev.last_seen})); }
  body.appendChild(devList);
  const ipsTitle=document.createElement('h5'); ipsTitle.textContent='IPs (last 30 days)'; body.appendChild(ipsTitle);
  for(const ip of (d.ips_last_30d||[])){
    const btn=document.createElement('button'); btn.className='secondary'; btn.textContent=ip.ip+' ('+ip.accounts_last_30d+' accounts)';
    btn.addEventListener('click',()=>loadIPAccounts(ip.ip));
    body.appendChild(btn);
  }
  const bansTitle=document.createElement('h5'); bansTitle.textContent='Bans'; body.appendChild(bansTitle);
  const banList=document.createElement('ul');
  for(const b of (d.bans||[])){ banList.appendChild(Object.assign(document.createElement('li'),{textContent:(b.type||'')+' / '+(b.scope||'')+' / '+(b.target||'')+' - '+(b.reason||'')})); }
  body.appendChild(banList);
  document.getElementById('detailsModal').classList.remove('hidden');
}
function closeDetailsModal(e){ if(e && e.target!==e.currentTarget) return; document.getElementById('detailsModal').classList.add('hidden'); }

async function loadIPAccounts(ip){
  const res=await fetch('/api/admin/ip-accounts?ip='+encodeURIComponent(ip),{headers:authHeaders()});
  const data=await res.json().catch(()=>({}));
  alert('IP '+ip+': '+data.count+' accounts\n'+(data.accounts||[]).map(a=>a.username).join(', '));
}

async function loadTripwires(){
  const res=await fetch('/api/admin/tripwires',{headers:authHeaders()});
  const data=await res.json().catch(()=>({}));
  const tbody=document.querySelector('#tripTable tbody'); tbody.innerHTML='';
  for(const e of (data.events||[])){
    const tr=document.createElement('tr');
    for(const v of [e.id,e.kind,e.detail,e.ip,e.account_id,e.created_at]){
      const td=document.createElement('td'); td.textContent=(v==null?'':v); tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  if(!res.ok) status('tripwires: '+res.status);
}

async function approveSkin(approved){
  const id=document.getElementById('skinId').value;
  const res=await fetch('/api/admin/skins/'+encodeURIComponent(id)+'/approve',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({approved})});
  status('skin '+id+': '+res.status);
}

async function loadInvites(){
  const res=await fetch('/api/admin/invites',{headers:authHeaders()});
  const data=await res.json().catch(()=>({}));
  const tbody=document.querySelector('#inviteTable tbody'); tbody.innerHTML='';
  for(const inv of (data.invites||[])){
    const tr=document.createElement('tr');
    const c1=document.createElement('td'); c1.textContent=inv.id;
    const c2=document.createElement('td'); c2.textContent=inv.identifier;
    const c3=document.createElement('td'); c3.textContent=inv.created_at;
    const c4=document.createElement('td');
    const b=document.createElement('button'); b.textContent='Remove'; b.className='danger';
    b.addEventListener('click',()=>removeInvite(inv.id));
    c4.appendChild(b);
    tr.appendChild(c1); tr.appendChild(c2); tr.appendChild(c3); tr.appendChild(c4);
    tbody.appendChild(tr);
  }
}
async function addInvite(){
  const ident=document.getElementById('inviteIdent').value;
  const res=await fetch('/api/admin/invites',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({identifier:ident})});
  status('invite: '+res.status);
  loadInvites();
}
async function removeInvite(id){
  const res=await fetch('/api/admin/invites/'+id,{method:'DELETE',headers:authHeaders()});
  status('remove invite: '+res.status);
  loadInvites();
}
async function loadBans(){
  const res=await fetch('/api/admin/bans',{headers:authHeaders()});
  const data=await res.json().catch(()=>({}));
  const tbody=document.querySelector('#bansTable tbody'); tbody.innerHTML='';
  for(const b of (data.bans||[])){
    const tr=document.createElement('tr');
    for(const v of [b.id,b.type,b.scope,b.target,b.reason,b.active?'yes':'no']){const td=document.createElement('td'); td.textContent=(v==null?'':v); tr.appendChild(td);}
    const td=document.createElement('td');
    const btn=document.createElement('button'); btn.textContent='Unban'; btn.className='secondary'; btn.addEventListener('click',async()=>{await fetch('/api/admin/bans/'+b.id,{method:'DELETE',headers:authHeaders()}); loadBans();});
    td.appendChild(btn); tr.appendChild(td);
    tbody.appendChild(tr);
  }
}
async function loadHwidBans(){
  const res=await fetch('/api/admin/hwid/bans',{headers:authHeaders()});
  const data=await res.json().catch(()=>({}));
  const tbody=document.querySelector('#hwidTable tbody'); tbody.innerHTML='';
  for(const hwid of (data.bans||[])){
    const tr=document.createElement('tr');
    const td1=document.createElement('td'); td1.textContent=hwid; tr.appendChild(td1);
    const td2=document.createElement('td');
    const btn=document.createElement('button'); btn.textContent='Unban'; btn.className='secondary'; btn.addEventListener('click',async()=>{await fetch('/api/admin/hwid/unban',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({device_id:hwid})}); loadHwidBans();});
    td2.appendChild(btn); tr.appendChild(td2);
    tbody.appendChild(tr);
  }
}
async function banHwid(){
  const device_id=document.getElementById('hwidValue').value;
  await fetch('/api/admin/hwid/ban',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({device_id})});
  loadHwidBans();
}
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'){ document.getElementById('banModal').classList.add('hidden'); document.getElementById('actionModal').classList.add('hidden'); document.getElementById('detailsModal').classList.add('hidden'); } });
</script>
</body>
</html>
