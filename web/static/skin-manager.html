<body onload="loadSkins()">
    <div class="header">Skin Manager</div>
    <form id="loginForm" onsubmit="event.preventDefault(); uploadSkin();">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <div id="uploadSection">
        <label for="skinFileInput">Upload Skin: </label>
        <input type="file" id="skinFileInput" accept=".png" onchange="previewImage(event)">
        <img src="#" alt="Preview Image" id="preview">
    </div>
    <button onclick="uploadSkin()">Upload</button>
    <p id="status"></p>
    <ul id="skins"></ul>
    
    <script>
        const accessToken = ''; // Initialize with the token if available, otherwise leave it empty.
        
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function() {
                document.getElementById('preview').src = reader.result;
            };
            reader.readAsDataURL(event.target.files[0]);
        }
        
        async function uploadSkin() {
            const usernameInput = document.querySelector('#loginForm input[name="username"]');
            const passwordInput = document.querySelector('#loginForm input[name="password"]');
            accessToken = btoa(`${usernameInput.value}:${passwordInput.value}`); // Basic Auth token generation for demo purposes, use your preferred method to handle tokens securely.
            
            var formData = new FormData();
            const fileField = document.querySelector('input[type="file"]');
            if (!fileField.files || !fileField.files[0]) { return; } // Check the existence of files and prevent upload on no selection or error cases.
            
            formData.append("skin", fileField.files[0]);
            const response = await fetch('/api/v1/skins/default', {
                method: 'PUT',
                body: formData,
                headers: {'Authorization': `Bearer ${accessToken}`} // Use the generated token here if you have a different way to manage tokens.
            });
            
            const statusText = await response.text();
            document.getElementById('status').textContent = statusText;
            loadSkins();
        }
        
        async function loadSkins() {
            const skinsList = document.querySelector('#skins');
            skinsList.innerHTML = ''; // Clear previous list items if any exist.
            
            try {
                const response = await fetch('/api/v1/skins', { headers: {'Authorization': `Bearer ${accessToken}`} });
                const data = await response.json();
                
                for (const skin of data) { // Assuming the API returns an array with skins, adjust this based on actual server responses.
                    var li = document.createElement('li');
                    li.textContent = skin;
                    skinsList.appendChild(li);
                }
            } catch (error) {
                console.error("Error loading skins:", error);
                document.getElementById('status').textContent = "Failed to load skins.";
            }
        }
    </script>
</body>
</html>
