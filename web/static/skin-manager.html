<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skin Manager</title>
    <style>
        body { background-color: #1E1E1E; color: #D4D4D4; font-family: Arial, sans-serif; }
        .header { text-align: center; padding: 20px 0; background-color: #3FB950; color: white; }
        form { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
        input[type="text"], input[type="password"] { width: 200px; padding: 8px; box-sizing: border-box; }
        #uploadSection, .previewArea { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; }
        input[type="file"] { display: none; }
        label, button { padding: 8px 16px; background-color: #3FB950; color: white; border: none; cursor: pointer; }
        img#preview { max-width: 200px; height: auto; }
        p#status { text-align: center; margin-top: 20px; }
        ul#skins li { list-style-type: none; padding: 5px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">Skin Manager</div>

    <div id="loginBox">
        <form id="loginForm" onsubmit="event.preventDefault(); doLogin();">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <!-- Cloudflare Turnstile (set data-sitekey to your site key; leave empty to disable in dev) -->
            <div class="cf-turnstile" data-sitekey="" data-callback="onTurnstile"></div>
            <button type="submit">Login</button>
        </form>
        <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    </div>

    <div id="appBox" class="hidden">
        <div id="uploadSection">
            <label for="skinFileInput">Upload Skin: </label>
            <input type="file" id="skinFileInput" accept=".png" onchange="previewImage(event)">
            <img src="#" alt="Preview Image" id="preview">
        </div>
        <div style="text-align:center; margin-top:10px;">
            <button onclick="uploadSkin()">Upload</button>
            <button onclick="logout()">Logout</button>
        </div>
        <p id="status"></p>
        <ul id="skins"></ul>
    </div>

    <script>
        let accessToken = '';
        let turnstileToken = '';
        function onTurnstile(token) { turnstileToken = token; }

        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function() { document.getElementById('preview').src = reader.result; };
            reader.readAsDataURL(event.target.files[0]);
        }

        async function doLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, device_id: 'web-skin-manager', turnstile_token: turnstileToken })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.access_token) {
                document.getElementById('status').textContent = 'Login failed: ' + (data.error || res.status);
                return;
            }
            accessToken = data.access_token;
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('appBox').classList.remove('hidden');
            loadSkins();
        }

        function logout() {
            accessToken = '';
            document.getElementById('appBox').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
        }

        async function uploadSkin() {
            const fileField = document.querySelector('input[type="file"]');
            if (!fileField.files || !fileField.files[0]) {
                document.getElementById('status').textContent = 'No file selected.';
                return;
            }
            var formData = new FormData();
            formData.append('skin', fileField.files[0]);
            const response = await fetch('/api/v1/skin-files', {
                method: 'POST',
                body: formData,
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            const text = await response.text();
            document.getElementById('status').textContent = text;
            loadSkins();
        }

        async function loadSkins() {
            const skinsList = document.querySelector('#skins');
            skinsList.innerHTML = '';
            try {
                const response = await fetch('/api/v1/skin-files', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                if (!response.ok) {
                    document.getElementById('status').textContent = 'Failed to load skins: ' + response.status;
                    return;
                }
                const data = await response.json().catch(() => []);
                const items = Array.isArray(data) ? data : (data.skins || []);
                for (const skin of items) {
                    var li = document.createElement('li');
                    li.textContent = typeof skin === 'string' ? skin : (skin.skin_id || JSON.stringify(skin));
                    skinsList.appendChild(li);
                }
            } catch (error) {
                console.error('Error loading skins:', error);
                document.getElementById('status').textContent = 'Failed to load skins.';
            }
        }
    </script>
</body>
</html>
